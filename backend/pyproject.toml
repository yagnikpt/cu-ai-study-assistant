[project]
name = "cu-study-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for CU Study Assistant"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.135.1",
    "google-cloud-aiplatform>=1.140.0",
    "google-cloud-storage>=3.9.0",
    "google-genai>=1.63.0",
    "httpx>=0.28.1",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.11.0",
    "pymupdf>=1.27.1",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.22",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.0.48",
]
