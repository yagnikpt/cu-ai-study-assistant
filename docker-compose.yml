services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: study_assistant
      POSTGRES_PASSWORD: study_assistant
      POSTGRES_DB: study_assistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
